<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>춘식이 공부게임 3.0</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7f5;color:#20262e;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif}
.app{max-width:760px;margin:auto;padding:16px}.card{background:#fff;border-radius:22px;padding:20px;margin:14px 0;box-shadow:0 7px 25px #0000000d}
h1,h2{margin-top:0}.sub,.hint{color:#68737c}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:inherit}.subject,.diff{border:2px solid #e1e7e3;background:#fff;border-radius:15px;padding:16px;font-weight:800;cursor:pointer}
.subject.active,.diff.active{border-color:#20a84a;background:#eefaf1}
.primary{width:100%;border:0;border-radius:14px;background:#20a84a;color:white;padding:15px;font-weight:800;cursor:pointer}
.secondary{border:0;border-radius:12px;background:#edf1ef;padding:12px 16px;font-weight:700;cursor:pointer}
.upload{border:2px dashed #b9c8bd;border-radius:18px;padding:20px;text-align:center;background:#fbfdfb}
.upload label{display:inline-block;background:#20a84a;color:#fff;padding:13px 18px;border-radius:12px;font-weight:800;cursor:pointer}
input[type=file]{display:none}.preview{display:none;max-width:100%;max-height:280px;margin:14px auto 0;border-radius:14px}
textarea{width:100%;min-height:160px;padding:14px;border:2px solid #e1e7e3;border-radius:14px;font-size:16px}
.hidden{display:none!important}.pill{background:#eef1ef;padding:6px 10px;border-radius:99px;font-size:13px;font-weight:700}
.top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.progress{height:9px;background:#e8ece9;border-radius:9px;overflow:hidden;margin:12px 0}.fill{height:100%;background:#20a84a;width:0}
.choice{display:block;width:100%;text-align:left;border:0;background:#f1f4f2;padding:15px;margin:9px 0;border-radius:13px;cursor:pointer}
.choice:disabled{cursor:default}.correct{background:#d9f5df!important}.wrong{background:#ffe0e0!important}
.question{font-size:21px;font-weight:800;white-space:pre-wrap;line-height:1.55}.points li{margin:9px 0;line-height:1.5}
.status{padding:12px;border-radius:12px;background:#f3f7f4;margin-top:12px}.ok{background:#e8f8eb}.warn{background:#fff5dc}
</style>
</head>
<body>
<div class="app">
<div class="card">
 <div class="top"><div><h1>📚 춘식이 공부게임</h1><div class="sub">사진 한 장이면 공부 준비 끝!</div></div><div>⭐ <b id="xpTotal">0</b> XP</div></div>
</div>

<section id="setup">
<div class="card"><h2>1. 과목 선택</h2><div class="grid">
<button type="button" class="subject active" data-subject="역사">🏛️ 역사</button>
<button type="button" class="subject" data-subject="국어">📖 국어</button>
<button type="button" class="subject" data-subject="사회">🌏 사회</button>
<button type="button" class="subject" data-subject="영어">🇺🇸 영어</button>
</div></div>

<div class="card">
<h2>2. 공부 내용 넣기</h2>
<div class="upload">
<label for="photo">📷 사진 찍기 / 사진 선택</label>
<input id="photo" type="file" accept="image/*" capture="environment">
<img id="preview" class="preview">
<div id="ocrStatus" class="status hidden"></div>
</div>
<br>
<textarea id="notes" placeholder="사진을 찍으면 여기에 글자가 자동으로 들어옵니다. 직접 붙여넣어도 됩니다."></textarea>
<br><br>
<button type="button" class="primary" id="analyze">🧠 내용 분석하고 암기자료 만들기</button>
</div>
</section>

<section id="study" class="hidden">
<div class="card">
<div class="top"><span class="pill" id="studySubject"></span><span class="pill">🧠 암기 카드</span></div>
<h2>핵심 내용을 기억해보자</h2>
<p id="summary"></p>
<h3>🔑 핵심 포인트</h3><ul id="points" class="points"></ul>
<button type="button" class="primary" id="toDifficulty">문제 만들기 →</button>
</div>
</section>

<section id="difficulty" class="hidden">
<div class="card"><h2>난이도를 선택해봐!</h2>
<div class="grid">
<button type="button" class="diff active" data-diff="하">🟢 하<br><small>기본 기억</small></button>
<button type="button" class="diff" data-diff="중">🟡 중<br><small>응용</small></button>
<button type="button" class="diff" data-diff="상">🔴 상<br><small>심화</small></button>
</div><br>
<button type="button" class="primary" id="startQuiz">문제 풀기 →</button></div>
</section>

<section id="quiz" class="hidden">
<div class="card">
<div class="top"><span class="pill" id="quizMeta"></span><span class="pill"><span id="qnum">1</span>/6</span></div>
<div class="progress"><div class="fill" id="fill"></div></div>
<div class="question" id="question"></div>
<div id="choices"></div>
<div id="feedback" class="hint"></div>
<button type="button" class="primary hidden" id="next">다음 문제 →</button>
</div>
</section>

<section id="result" class="hidden">
<div class="card"><h2>🎉 학습 완료!</h2><p id="resultText"></p>
<button type="button" class="primary" id="retry">같은 내용 다시 풀기</button><br><br>
<button type="button" class="secondary" id="newStudy">새 공부 내용</button></div>
</section>
</div>

<script>
"use strict";
let subject="역사", difficulty="하", notes="", facts=[], questions=[], qIndex=0, score=0, xp=0, answer="";
const $=id=>document.getElementById(id);
function show(id){["setup","study","difficulty","quiz","result"].forEach(x=>$(x).classList.toggle("hidden",x!==id))}
function clean(s){return s.replace(/\s+/g," ").trim()}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function escapeHTML(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

document.querySelectorAll(".subject").forEach(b=>b.addEventListener("click",()=>{
 document.querySelectorAll(".subject").forEach(x=>x.classList.remove("active"));b.classList.add("active");subject=b.dataset.subject;
}));
document.querySelectorAll(".diff").forEach(b=>b.addEventListener("click",()=>{
 document.querySelectorAll(".diff").forEach(x=>x.classList.remove("active"));b.classList.add("active");difficulty=b.dataset.diff;
}));

$("photo").addEventListener("change", async e=>{
 const file=e.target.files[0]; if(!file)return;
 const preview=$("preview"), status=$("ocrStatus");
 preview.src=URL.createObjectURL(file);preview.style.display="block";
 status.className="status";status.textContent="📷 사진을 확인하는 중...";
 try{
   if(!window.Tesseract) throw new Error("OCR 라이브러리를 불러오지 못했습니다.");
   status.textContent="🔎 사진 속 글자를 읽는 중... 잠시만 기다려줘!";
   const result=await Tesseract.recognize(file,"kor+eng",{logger:m=>{
     if(m.status==="recognizing text") status.textContent=`🔎 글자를 읽는 중... ${Math.round((m.progress||0)*100)}%`;
   }});
   const text=clean(result.data.text||"");
   if(text.length<3){
     status.className="status warn";status.textContent="⚠️ 글자를 충분히 읽지 못했어. 사진을 더 밝고 선명하게 찍거나 아래에 직접 입력해줘.";
   }else{
     $("notes").value=text;
     status.className="status ok";status.textContent="✅ 사진에서 공부 내용을 읽었어! 아래 내용을 확인한 뒤 분석 버튼을 눌러줘.";
   }
 }catch(err){
   status.className="status warn";status.textContent="⚠️ 사진 읽기에 실패했어. 인터넷 연결을 확인하거나 내용을 직접 입력해줘.";
 }
});

$("analyze").addEventListener("click",()=>{
 notes=clean($("notes").value);
 if(notes.length<3){alert("공부 내용을 입력하거나 글자가 잘 보이는 사진을 찍어줘!");return}
 facts=notes.split(/[.!?。！？\n]+/).map(clean).filter(x=>x.length>=3);
 if(facts.length===0)facts=[notes];
 buildStudy();show("study");
});

function buildStudy(){
 $("studySubject").textContent=subject;
 const sentences=facts.slice(0,8);
 $("summary").textContent=sentences.slice(0,2).join(". ") + (sentences.length>2?" …":"");
 $("points").innerHTML=sentences.map((x,i)=>`<li><b>${i+1}.</b> ${escapeHTML(x)}</li>`).join("");
}

$("toDifficulty").addEventListener("click",()=>show("difficulty"));
$("startQuiz").addEventListener("click",()=>{buildQuestions();qIndex=0;score=0;xp=0;show("quiz");renderQuestion()});

function buildQuestions(){
 questions=[];
 for(let i=0;i<6;i++){
   const f=facts[i%facts.length];
   const words=f.split(/\s+/).filter(w=>w.length>=2);
   if(i%3===0 && words.length){
     const target=words[Math.min(Math.floor(words.length/2),words.length-1)];
     questions.push({text:"빈칸에 들어갈 가장 알맞은 말은?\n"+f.replace(target,"_____"),ans:target});
   }else{
     questions.push({text:(i%3===1?"다음 내용과 가장 관련 있는 것은?":"학습한 내용 중 알맞은 것은?")+"\n"+f,ans:f});
   }
 }
}

function renderQuestion(){
 const q=questions[qIndex];answer=q.ans;
 $("quizMeta").textContent=subject+" · "+difficulty;$("qnum").textContent=qIndex+1;
 $("fill").style.width=(qIndex/6*100)+"%";$("question").textContent=q.text;
 $("feedback").textContent="";$("next").classList.add("hidden");$("choices").innerHTML="";
 let pool;
 if(q.text.includes("_____")){
   pool=[q.ans,"핵심 개념","중요한 내용","관련 개념"];
 }else{
   pool=[q.ans,...facts.filter(x=>x!==q.ans)];
 }
 shuffle(pool).slice(0,4).forEach(c=>{
   const b=document.createElement("button");b.type="button";b.className="choice";b.textContent=c;
   b.addEventListener("click",()=>answerQuestion(b,c));$("choices").appendChild(b);
 });
}
function answerQuestion(btn,c){
 document.querySelectorAll(".choice").forEach(b=>b.disabled=true);
 const correct=c===answer;
 if(correct){btn.classList.add("correct");score++;xp+=difficulty==="하"?10:difficulty==="중"?15:20;$("feedback").textContent="✅ 정답! ⭐ XP 획득!"}
 else{btn.classList.add("wrong");$("feedback").textContent="❌ 아쉽다. 정답을 다시 기억해보자."}
 $("xpTotal").textContent=xp;$("next").classList.remove("hidden");
}
$("next").addEventListener("click",()=>{qIndex++;if(qIndex>=6)finish();else renderQuestion()});
function finish(){
 $("fill").style.width="100%";$("resultText").textContent=`6문제 중 ${score}문제 정답 · ⭐ ${xp} XP 획득 · ${difficulty} 난이도`;
 show("result");
}
$("retry").addEventListener("click",()=>{qIndex=0;score=0;xp=0;show("quiz");renderQuestion()});
$("newStudy").addEventListener("click",()=>location.reload());
</script>
</body>
</html>
